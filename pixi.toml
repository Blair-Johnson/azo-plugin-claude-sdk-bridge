[workspace]
name = "azo-plugin-claude-sdk-bridge"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[dependencies]
nodejs = ">=22,<23"

[tasks]
install = "npm ci --ignore-scripts --no-audit --no-fund"
start = "node src/cli.mjs"
test = "node --test tests/*.test.mjs"
test-host = "bash scripts/test-host.sh"

[tool.agent-zoo.plugin]
name = "azo-plugin-claude-sdk-bridge"
common = ["plugin/claude_sdk_bridge.py"]

# These dependencies belong to the sidecar, not the host Python environment.
[tool.agent-zoo.plugin.workspace]
setup-task = "install"
